services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: regear
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regear}
      POSTGRES_DB: regear
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - regear-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regear -d regear"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://regear:${POSTGRES_PASSWORD:-regear}@postgres:5432/regear?schema=public
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://regear:${POSTGRES_PASSWORD:-regear}@postgres:5432/regear?schema=public
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - regear-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    command: ["npm", "start"]
volumes:
  regear-postgres:
  regear-uploads:
